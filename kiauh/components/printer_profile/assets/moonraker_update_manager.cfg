[update_manager]
channel: stable
refresh_interval: 24
enable_system_updates: True
enable_packagekit: false
enable_auto_refresh: True

[update_manager mainsail-config]
type: git_repo
primary_branch: master
path: ~/mainsail-config
origin: https://github.com/mainsail-crew/mainsail-config.git
managed_services: klipper

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail

# Crowsnest update_manager entry
[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh

# Sonar update_manager entry
[update_manager sonar]
type: git_repo
path: ~/sonar
origin: https://github.com/mainsail-crew/sonar.git
primary_branch: main
managed_services: sonar
install_script: tools/install.sh

[update_manager timelapse]
type: git_repo
primary_branch: main
path: ~/moonraker-timelapse
origin: https://github.com/mainsail-crew/moonraker-timelapse.git
managed_services: klipper moonraker

[update_manager KlipperScreen]
type: git_repo
path: ~/KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
virtualenv: ~/.KlipperScreen-env
requirements: scripts/KlipperScreen-requirements.txt
system_dependencies: scripts/system-dependencies.json
managed_services: KlipperScreen

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager KlipperLCD]
type: git_repo
channel: dev
path: /home/biqu/KlipperLCD
origin: git@github.com:HerrHaseGermany/Artillery-KlipperLCD.git
primary_branch: main
managed_services: KlipperLCD

[update_manager KlipperCameraControl]
type: git_repo
path: /home/biqu/KlipperCameraControl
origin: https://github.com/HerrHaseGermany/KlipperCameraControl.git
primary_branch: main
install_script: install.sh
is_system_service: False

[update_manager KlipperPLR]
type: git_repo
path: /home/biqu/KlipperPLR
origin: https://github.com/HerrHaseGermany/KlipperPLR.git
primary_branch: main
install_script: install.sh
is_system_service: False

[update_manager klipper-calibration-wizard]
type: git_repo
channel: dev
path: /home/biqu/klipper-calibration-wizard
origin: https://github.com/HerrHaseGermany/Calibration-Wizard.git
primary_branch: main
virtualenv: /home/biqu/klipper-calibration-wizard/.venv
requirements: requirements.txt
managed_services: klipper-calibration-wizard
info_tags:
  desc=Klipper Calibration Wizard
